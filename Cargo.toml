[package]
name = "swiftspot"
version = "1.2.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A native Spotify client"
repository = "https://github.com/hanzpo/swiftspot"
keywords = ["spotify", "music", "librespot", "player"]
categories = ["multimedia::audio"]

[lib]
name = "swiftspot"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
# One protected-store API, with only each target's native provider below.
# Durable Spotify grants must not be copied into ordinary state JSON.
keyring-core = "1"
# The log file for bug reports and the panic log (env_logger underneath).
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.17.1" }
# The audio device stream: it pauses, so a paused player costs no CPU (#636),
# follows the default output and reopens after a failure.
fastframe-audio = { git = "https://github.com/crmne/fastframe", tag = "v0.17.1" }
# One running copy per user: a lock and a private channel for external control.
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.17.1" }
# The desktop's media controls: Now Playing on macOS, MPRIS on Linux.
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.17.1" }
# webp because Spotify's CDN serves some playlist covers as WebP.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Spotify playback and Connect. rustls everywhere so the client links one TLS
# stack and builds without OpenSSL on every platform.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-connect = { version = "0.8", default-features = false }
librespot-metadata = { version = "0.8", default-features = false }
librespot-protocol = { version = "0.8", default-features = false }
# Word-by-word lyrics decode a whole song ahead of playback, reading its
# file as the player does: librespot's own fetching and decryption, and the
# Symphonia types its decoder takes.
librespot-audio = { version = "0.8", default-features = false }
symphonia = { version = "0.5", default-features = false }
# Parses the rootlist's playlist4 protobuf, the same crate librespot generates with.
protobuf = "3"
# Local playback's audio sink is this crate's own (src/sink.rs).
rodio = { version = "0.21", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "blocking", "socks", "system-proxy"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
miniz_oxide = "0.8"
regex = "1"
# The transforms around karaoke's vocal model (src/karaoke/mdx.rs).
realfft = "3.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
open = "5"
percent-encoding = "2"
urlencoding = "2"
jiff = "0.2"
mdns-sd = "0.21"
hmac = "0.12"
pbkdf2 = "0.12"
aes = "0.8"
ctr = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# Karaoke's vocal model on the Neural Engine (src/karaoke/coreml.rs).
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLFeatureValue", "MLModel_MLModelCompilation", "block2"] }
block2 = "0.6"
half = "2"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString", "NSThread", "NSDictionary", "NSData", "NSURL", "NSArray", "NSValue", "NSError"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
librespot-playback = { version = "0.8", default-features = false, features = ["pulseaudio-backend", "rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
hyper-proxy2 = { git = "https://github.com/crmne/hyper-proxy2", rev = "efca4811371ddae81c06be168de54194938d70b1" }
librespot-audio = { git = "https://github.com/hanzpo/librespot", rev = "0f04ee23f0d626e0760cc5246a7f3d4579b99057" }
librespot-connect = { git = "https://github.com/hanzpo/librespot", rev = "0f04ee23f0d626e0760cc5246a7f3d4579b99057" }
librespot-core = { git = "https://github.com/hanzpo/librespot", rev = "0f04ee23f0d626e0760cc5246a7f3d4579b99057" }
librespot-metadata = { git = "https://github.com/hanzpo/librespot", rev = "0f04ee23f0d626e0760cc5246a7f3d4579b99057" }
librespot-oauth = { git = "https://github.com/hanzpo/librespot", rev = "0f04ee23f0d626e0760cc5246a7f3d4579b99057" }
librespot-playback = { git = "https://github.com/hanzpo/librespot", rev = "0f04ee23f0d626e0760cc5246a7f3d4579b99057" }
librespot-protocol = { git = "https://github.com/hanzpo/librespot", rev = "0f04ee23f0d626e0760cc5246a7f3d4579b99057" }
