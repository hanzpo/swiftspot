<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SwiftSpot: five white equalizer bars on a red tile, lit from above. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EB5268"/>
      <stop offset="1" stop-color="#BA2B3F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DADAE0"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="barShadow" x="-60%" y="-20%" width="220%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- The body, on the macOS icon grid. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>
  <g fill="url(#bar)" filter="url(#barShadow)">
    <rect x="277" y="422" width="70" height="180" rx="35"/>
    <rect x="377" y="352" width="70" height="320" rx="35"/>
    <rect x="477" y="292" width="70" height="440" rx="35"/>
    <rect x="577" y="352" width="70" height="320" rx="35"/>
    <rect x="677" y="422" width="70" height="180" rx="35"/>
  </g>
</svg>
