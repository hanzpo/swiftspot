[package]
name = "swiftspot-tui"
version = "1.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "SwiftSpot in a terminal: a front end for the running app's API socket"
repository = "https://github.com/hanzpo/swiftspot"
publish = false

[[bin]]
name = "swiftspot"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
